name: docker-publish

# Builds and pushes the images on every push to main, on version tags, and
# on demand. A main push refreshes the moving tags (latest / gpu / gpu-arm64)
# plus a sha-<commit> tag; a v* tag additionally publishes <tag> and
# <major>.<minor> tags.
#
#   <image>:<tag>            CPU image, linux/amd64 + linux/arm64
#   <image>:<tag>-gpu        NVIDIA image, linux/amd64, CUDA 12.8 wheels (RTX 30/40/50)
#   <image>:<tag>-gpu-arm64  NVIDIA image, linux/arm64, CUDA 13 wheels (DGX Spark)
#   plus `latest`, `gpu`, `gpu-arm64` moving tags.
#
# Setup (Settings > Secrets and variables > Actions):
#   secrets DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   optional variable DOCKERHUB_IMAGE (default geoffvaughan/video-highlights)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
            runner: ubuntu-latest
            suffix: ""
            moving: latest
            build_args: ""
          - flavor: gpu
            dockerfile: Dockerfile.gpu
            platforms: linux/amd64
            runner: ubuntu-latest
            suffix: "-gpu"
            moving: gpu
            build_args: |
              CUDA_IMAGE=nvidia/cuda:12.8.1-base-ubuntu24.04
              TORCH_INDEX=cu128
          - flavor: gpu-arm64
            dockerfile: Dockerfile.gpu
            platforms: linux/arm64
            # Native arm64 runner (no QEMU); GitHub-hosted for public repos.
            runner: ubuntu-24.04-arm
            suffix: "-gpu-arm64"
            moving: gpu-arm64
            build_args: |
              CUDA_IMAGE=nvidia/cuda:13.0.1-base-ubuntu24.04
              TORCH_INDEX=cu130
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (CUDA wheels are large)
        if: startsWith(matrix.flavor, 'gpu')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Image name
        id: image
        run: echo "name=${{ vars.DOCKERHUB_IMAGE || 'geoffvaughan/video-highlights' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, ',')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ matrix.moving }},suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,scope=${{ matrix.flavor }},mode=max
