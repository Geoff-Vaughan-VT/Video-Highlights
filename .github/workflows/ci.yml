name: ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url "$TORCH_INDEX"
          pip install -r requirements-dev.txt

      - name: Shell / compose sanity
        run: |
          for f in docker/*.sh scripts/*.sh run_*.sh stop_docker.sh; do bash -n "$f"; done
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"

      - name: Run tests
        env:
          VH_MODEL_DIR: ${{ github.workspace }}/models
        run: python -m pytest -q -p no:cacheprovider

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url "$TORCH_INDEX"
          pip install -r requirements-ml.txt

      - name: Cache detector weights
        uses: actions/cache@v4
        with:
          path: models
          key: models-yolov8-${{ hashFiles('scripts/download_models.py') }}

      - name: Fetch weights
        run: python scripts/download_models.py --model-dir models yolov8n.pt yolov8s.pt

      - name: Bench (synthetic, CPU)
        env:
          VH_MODEL_DIR: ${{ github.workspace }}/models
        run: python bench/bench_match.py --minutes 0.2 --height 360 --detect-frames 4

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-${{ github.sha }}
          path: bench/results/*.*
          if-no-files-found: warn
