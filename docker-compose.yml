# Video Highlights - local / single-host deployment.
#
#   CPU:              docker compose up -d --build                (api + worker)
#   NVIDIA GPU:       docker compose --profile gpu up -d --build api worker-gpu
#   + Postgres:       docker compose --profile cloud up -d        (set VH_DB_URL, see .env.example)
#
# Configuration: copy .env.example to .env. Values in .env feed both the
# ${VAR:-default} interpolation below and the containers (env_file).
# Source videos: VH_MEDIA_DIR on the host is mounted read-only at /media;
# register them in the Studio as "Local file on the server" (/media/<file>).
#
# Never run `worker` and `worker-gpu` against the same queue at once: the
# queue claim is not atomic yet (see docs/DEPLOYMENT.md).

name: video-highlights

x-vh-env: &vh-env
  VH_DB_URL: ${VH_DB_URL:-sqlite:////data/db/video_highlights.db}
  VH_OUTPUT_ROOT: ${VH_OUTPUT_ROOT:-/data/outputs}
  VH_LOCAL_STORAGE_ROOT: ${VH_LOCAL_STORAGE_ROOT:-/data/storage}
  VH_JOB_EXECUTION_MODE: ${VH_JOB_EXECUTION_MODE:-queue}
  VH_TEST_MODE: ${VH_TEST_MODE:-false}
  VH_LOG_LEVEL: ${VH_LOG_LEVEL:-INFO}
  VH_JOB_LOG_DETAIL: ${VH_JOB_LOG_DETAIL:-basic}
  VH_AUTH_REQUIRED: ${VH_AUTH_REQUIRED:-false}
  VH_SKIP_USER_MANAGEMENT: ${VH_SKIP_USER_MANAGEMENT:-true}
  VH_BASE_TENANT_SLUG: ${VH_BASE_TENANT_SLUG:-sandbox}
  VH_BASE_TENANT_NAME: ${VH_BASE_TENANT_NAME:-Sandbox Tenant}
  VH_MODEL_DIR: /models
  # In-container port is always 8000; VH_API_PORT in .env only moves the host port.
  VH_API_PORT: "8000"
  VH_DEVICE: ${VH_DEVICE:-auto}

x-vh-volumes: &vh-volumes
  - vh-data:/data
  - vh-models:/models
  - ${VH_MEDIA_DIR:-./media}:/media:ro

x-vh-common: &vh-common
  env_file:
    - path: .env
      required: false
  environment: *vh-env
  volumes: *vh-volumes
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  api:
    <<: *vh-common
    image: ${VH_IMAGE_CPU:-video-highlights:cpu}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "${VH_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # only when --profile cloud is active
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  worker:
    <<: *vh-common
    image: ${VH_IMAGE_CPU:-video-highlights:cpu}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "backend.worker"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  # NVIDIA worker (RTX rig x86_64, or DGX Spark arm64 with the build args
  # in .env.example). Needs the NVIDIA Container Toolkit / Docker Desktop
  # GPU support. Start it INSTEAD of `worker`:
  #   docker compose --profile gpu up -d --build api worker-gpu
  worker-gpu:
    <<: *vh-common
    profiles: ["gpu"]
    image: ${VH_IMAGE_GPU:-video-highlights:gpu}
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        CUDA_IMAGE: ${VH_CUDA_IMAGE:-nvidia/cuda:12.8.1-base-ubuntu24.04}
        TORCH_INDEX: ${VH_TORCH_INDEX:-cu128}
        INSTALL_TENSORRT: ${VH_INSTALL_TENSORRT:-0}
        MODELS: ${VH_MODELS:-yolov8n.pt yolov8s.pt}
    command: ["python", "-m", "backend.worker"]
    environment:
      <<: *vh-env
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    ipc: host
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864

  # Optional Postgres for multi-host / cloud-like setups. Enable with
  # --profile cloud and set in .env:
  #   VH_DB_URL=postgresql+psycopg://vh:vh@postgres:5432/video_highlights
  postgres:
    profiles: ["cloud"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vh}
      POSTGRES_DB: ${POSTGRES_DB:-video_highlights}
    volumes:
      - vh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  vh-data:
  vh-models:
  vh-pg:
